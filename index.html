<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VS Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.header{background:#0757c9;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
.header h1{margin:0;font-size:20px}
.header small{opacity:.85}
.wrap{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{height:42px;border:1px solid #d9dfeb;border-radius:9px;padding:0 12px;font-size:14px}
input{flex:1;min-width:220px}
button{cursor:pointer;background:#0757c9;color:#fff;border:0;font-weight:600}
button.secondary{background:#eef3fb;color:#17345f}
button.active{background:#0757c9;color:#fff}
.label{font-size:12px;color:#697386;margin-bottom:6px;font-weight:700}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;background:#eef2f7;color:#344054;border:0;border-radius:18px}
.chip.active{background:#0757c9;color:#fff}
.store-list{font-size:13px;color:#344054;margin-top:8px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px 8px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}
th{font-size:12px;color:#667085;background:#f8fafc;position:sticky;top:0}
.stock{font-weight:800}
.stock.zero{color:#d92d20}
.stock.low{color:#b54708}
.stock.safe{color:#027a48}
.empty{text-align:center;padding:35px 15px;color:#667085}
.loading{text-align:center;padding:30px;color:#667085}
.badge{display:inline-block;padding:4px 8px;border-radius:12px;background:#eef3fb;font-size:11px}
@media(max-width:600px){
 .wrap{padding:9px}
 .card{padding:11px;border-radius:12px}
 .header h1{font-size:18px}
 input{min-width:100%;width:100%}
 button{flex:1}
 th,td{padding:8px 6px;font-size:12px}
}
</style>
</head>
<body>
<div class="header">
  <h1>VS Store</h1>
  <small id="loginInfo">Membandingkan stok antar store</small>
</div>

<div class="wrap">
  <div class="card">
    <div class="label">STORE PEMBANDING</div>
    <div class="row">
      <input id="compareStores" placeholder="Contoh: S008,S009,S143">
      <button onclick="compare()">Bandingkan</button>
    </div>
    <div class="store-list" id="storeInfo">Masukkan beberapa store code, pisahkan dengan koma.</div>
  </div>

  <div class="card">
    <div class="label">FILTER STOK</div>
    <div class="chips">
      <button class="chip active" data-cat="ALL" onclick="setCategory('ALL')">ALL</button>
      <button class="chip" data-cat="DEVICE" onclick="setCategory('DEVICE')">DEVICE</button>
      <button class="chip" data-cat="ACC" onclick="setCategory('ACC')">ACC</button>
      <button class="chip" data-cat="OTHER" onclick="setCategory('OTHER')">OTHER</button>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#667085">
      Hanya produk di store sendiri dengan stok 0–3 yang ditampilkan.
    </div>
  </div>

  <div class="card">
    <div class="row" style="align-items:center;justify-content:space-between">
      <div>
        <div class="label">HASIL VS STORE</div>
        <div id="summary">Belum ada perbandingan.</div>
      </div>
      <span class="badge" id="categoryBadge">ALL</span>
    </div>
  </div>

  <div class="card">
    <div id="result">
      <div class="empty">Masukkan store pembanding lalu klik <b>Bandingkan</b>.</div>
    </div>
  </div>
</div>

<script>
/*
  PAGE VS STORE
  Memakai google.script.run.
  Pastikan fungsi GS: getVSStoreStock(user, compareStores, category)
  sudah ter-deploy.
*/

let currentCategory = 'ALL';
let currentUser = null;
let lastCompareStores = [];

function getUser(){
  try{
    const raw = localStorage.getItem('finderUser');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}

function init(){
  currentUser = getUser();

  if(currentUser){
    document.getElementById('loginInfo').textContent =
      'Store: ' + (currentUser.storeCode || '-') +
      ' • ' + (currentUser.storeName || '');
  }
}

function setCategory(cat){
  currentCategory = cat;

  document.querySelectorAll('.chip').forEach(btn=>{
    btn.classList.toggle(
      'active',
      btn.dataset.cat === cat
    );
  });

  document.getElementById('categoryBadge').textContent = cat;

  // Kalau sudah pernah compare, langsung refresh hasil dengan filter baru.
  if(lastCompareStores.length){
    loadVS(lastCompareStores);
  }
}

function compare(){
  const raw =
    document.getElementById('compareStores').value || '';

  const stores = [...new Set(
    raw.split(',')
      .map(x => x.trim().toUpperCase())
      .filter(Boolean)
  )];

  if(!stores.length){
    document.getElementById('result').innerHTML =
      '<div class="empty">Masukkan minimal 1 store pembanding.</div>';
    return;
  }

  lastCompareStores = stores;
  loadVS(stores);
}

function loadVS(stores){
  const result = document.getElementById('result');

  result.innerHTML =
    '<div class="loading">Memuat stok store...</div>';

  document.getElementById('summary').textContent =
    'Sedang mengambil data...';

  if(typeof google === 'undefined' ||
     !google.script ||
     !google.script.run){
    result.innerHTML =
      '<div class="empty">Halaman ini harus dijalankan dari Web App Apps Script.</div>';
    return;
  }

  google.script.run
    .withSuccessHandler(renderVS)
    .withFailureHandler(function(err){
      result.innerHTML =
        '<div class="empty"><b>Gagal mengambil stok.</b><br>' +
        escapeHtml(err && err.message ? err.message : String(err)) +
        '</div>';

      document.getElementById('summary').textContent =
        'Terjadi error saat mengambil data.';
    })
    .getVSStoreStock(
      currentUser,
      stores,
      currentCategory
    );
}

function renderVS(data){
  if(!data){
    document.getElementById('result').innerHTML =
      '<div class="empty">Tidak ada response dari server.</div>';
    return;
  }

  if(data.error){
    document.getElementById('result').innerHTML =
      '<div class="empty">' +
      escapeHtml(data.error) +
      '</div>';
    return;
  }

  const items = Array.isArray(data.items)
    ? data.items
    : [];

  const stores = Array.isArray(data.stores)
    ? data.stores
    : [];

  const category =
    data.category || currentCategory;

  document.getElementById('categoryBadge').textContent =
    category;

  document.getElementById('storeInfo').innerHTML =
    'Store sendiri: <b>' +
    escapeHtml(data.ownStore || '-') +
    '</b> • Pembanding: <b>' +
    stores.length +
    '</b> store';

  document.getElementById('summary').textContent =
    items.length + ' SKU perlu dicek';

  if(!items.length){
    document.getElementById('result').innerHTML =
      '<div class="empty">' +
      '<b>Tidak ada stok yang perlu dibandingkan.</b><br>' +
      'Tidak ditemukan produk kategori ' +
      escapeHtml(category) +
      ' dengan stok store sendiri 0–3.' +
      '</div>';
    return;
  }

  let head = `
    <table>
      <thead>
        <tr>
          <th>Produk</th>
          <th>Store Sendiri</th>
  `;

  stores.forEach(s=>{
    head += `
      <th>${escapeHtml(s.storeCode)}<br>
        <span style="font-weight:400">${escapeHtml(s.storeName || '')}</span>
      </th>`;
  });

  head += `
        </tr>
      </thead>
      <tbody>
  `;

  let body = '';

  items.forEach(item=>{
    body += `
      <tr>
        <td>
          <b>${escapeHtml(item.materialDescription || '-')}</b><br>
          <span style="font-size:11px;color:#667085">
            ${escapeHtml(item.materialCode || '')}
            • ${escapeHtml(item.series || '')}
          </span>
        </td>
        <td>
          <span class="stock ${stockClass(item.ownStock)}">
            ${formatStock(item.ownStock)}
          </span>
        </td>
    `;

    stores.forEach(s=>{
      const found =
        Array.isArray(item.stores)
          ? item.stores.find(x =>
              String(x.storeCode || '').toUpperCase() ===
              String(s.storeCode || '').toUpperCase()
            )
          : null;

      const qty = found ? found.stock : 0;

      body += `
        <td>
          <span class="stock ${stockClass(qty)}">
            ${formatStock(qty)}
          </span>
        </td>
      `;
    });

    body += '</tr>';
  });

  body += '</tbody></table>';

  document.getElementById('result').innerHTML =
    '<div class="table-wrap">' +
    head + body +
    '</div>';
}

function stockClass(qty){
  const n = Number(qty) || 0;

  if(n <= 0) return 'zero';
  if(n <= 3) return 'low';
  return 'safe';
}

function formatStock(qty){
  const n = Number(qty) || 0;
  return Number.isInteger(n)
    ? String(n)
    : n.toFixed(1);
}

function escapeHtml(value){
  return String(value == null ? '' : value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

init();
</script>
</body>
</html>
